
[project]
name = "sparsenlreg"
version="2026.10.07"
authors = [
    {name = "Flavien Loiseau", email = "flavien.loiseau@insa-lyon.fr"},
]
description = "Non-linear sparse regression based on LASSO and non-linear feature expansion for symbolic regression."
readme = "README.md"
license = { file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">= 3.14"
dependencies = [
	"pandas",
	"numpy",
	"sympy",
	"scikit-learn",
	"matplotlib",
]

[project.urls]
# Documentation = "https://floiseau.github.io/sparsenlreg/"
Source = "https://github.com/floiseau/sparenlreg"

[project.scripts]
sparsenlreg = "sparsenlreg:sparsenlreg.main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparsenlreg*"]
