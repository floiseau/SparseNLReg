[data]
dataset = "dataset.csv"

# Degree=2 => R2=0.997
[model_features]
base_features = [
	"a_W",
	"Lc_L",
	"exp(a_W)",
	"exp(Lc_L)",
]
base_feature_names = [
	"\\frac{a}{W}",
	"\\frac{L_c}{L}",
	"\\exp\\left(\\frac{a}{W}\\right)",
	"\\exp\\left(\\frac{L_c}{L}\\right)",
]

[model_output]
output = "log(KI_centrifugal)"
output_name = "\\log(\\hat{K}_{I}^{\\omega})"

[expansion]
type = "polynomial"
[expansion.parameters]
degree = 1

[tradeoff_exploration]
solver = "lars"
# solver = "coordinate_descent"
# coordinate_descent_selection = "random"
N_fit = 512
log_beta_min = -3
log_beta_max = 1

[model_selection]
N_coeff_max = 4

[training]
polish = true
