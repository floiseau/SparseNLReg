[data]
dataset = "dataset.csv"

# Degree=2 => R2=0.997
[model_features]
base_features = [
	"a_W",
	"Lc_L",
	"exp(a_W)",
	"exp(Lc_L)",
]

[model_output]
output = "log(KI_centrifugal)"

[[expansions]]
type = "polynomial"
degree = 1

[tradeoff_exploration]
solver = "lars"
# solver = "coordinate_descent"
# coordinate_descent_selection = "random"
N_fit = 512
log_beta_min = -3
log_beta_max = 1

[model_selection]
N_coeff_max = 4

[training]
polish = true
