[data]
dataset = "data_ct_specimen.csv"

[model_features]
base_features = ["a", "exp(a)", "1/sqrt(1-a)"]
base_feature_names = ["a/b", "\\exp(a/b)", "\\frac{1}{\\sqrt{b-a}}"]

[model_output]
output = "KI_adim"
output_name = "\\hat{K}_{I}"

[polynomial]
degree = 3
include_bias = true

[tradeoff_exploration]
N_fit = 128
log_beta_min = -1
log_beta_max = 4

[model_selection]
N_coeff_max = 4
