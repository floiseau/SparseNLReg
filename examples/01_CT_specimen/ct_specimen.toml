[data]
dataset = "data_ct_specimen.csv"

[model_features]
base_features = ["a", "exp(a)", "1/sqrt(1-a)"]
base_feature_names = ["a/b", "\\exp(a/b)", "\\frac{1}{\\sqrt{1-a/b}}"]
feature_scaler = "MaxAbsScaler"

[model_output]
output = "KI_adim"
output_name = "\\hat{K}_{I}"

[polynomial]
degree = 3
fit_intercept = true

[tradeoff_exploration]
N_fit = 128
log_beta_min = -4
log_beta_max = 4

[model_selection]
N_coeff_max = 4
test_size = 0.5

[training]
polish = true
