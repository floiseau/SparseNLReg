[data]
dataset = "data_ct_specimen.csv"

[model_features]
base_features = ["a", "exp(a)", "1/sqrt(1-a)"]

[model_output]
output = "KI_adim"

[[expansions]]
type = "polynomial"
degree = 3

[tradeoff_exploration]
N_fit = 128
log_beta_min = -4
log_beta_max = 0

[model_selection]
N_coeff_max = 4
test_size = 0.0

[training]
polish = false
