[data]
dataset = "dataset.csv"

[model_features]
base_features = [
	"cos(deg2rad(alpha))",
	"sin(deg2rad(alpha))",
  # "tan(deg2rad(alpha))",
  "1/(1+W**2)",
  "1/(1+H**2)",
]

[model_output]
output = "KI"

[[expansions]]
type = "polynomial"
degree = 12

[tradeoff_exploration]
solver = "lars"
N_fit = 512
log_beta_min = -2
log_beta_max = 0

[model_selection]
N_coeff_max = 4
test_size = 0.0

[training]
polish = true

